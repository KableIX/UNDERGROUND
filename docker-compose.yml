# Local PostGIS for UNDERGROUND when cloud Supabase is unavailable.
# Usage: docker compose up -d postgis
# Then apply migrations under supabase/migrations/ in lexical order.
# Persistence mode: local-postgis (persistent) vs in-memory (tests without Docker).

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: underground-postgis
    environment:
      POSTGRES_USER: underground
      POSTGRES_PASSWORD: underground_dev_only
      POSTGRES_DB: underground
    ports:
      - "54322:5432"
    volumes:
      - underground_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underground -d underground"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  underground_pgdata:
